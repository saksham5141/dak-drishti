version: '3.8'

services:
  # 1. MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: dak_drishti_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dak_drishti_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # 2. DakDrishti Web Application & Python REST API Service
  app:
    build: .
    container_name: dak_drishti_web
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: dak_drishti_db
    depends_on:
      mysql_db:
        condition: service_healthy

volumes:
  mysql_data:
